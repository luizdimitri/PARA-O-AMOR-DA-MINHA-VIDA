<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Você ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #ffeef2;
      color: #4a4a4a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    h1 {
      color: #e63946;
      margin-bottom: 15px;
      font-size: 1.8rem;
    }

    .photo-card {
      background: #fff0f3;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .photo-card img {
      width: 100%;
      max-height: 350px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .caption {
      margin-top: 10px;
      font-size: 1.1rem;
      color: #555;
      font-style: italic;
    }

    .btn {
      background-color: #e63946;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
      margin-top: 10px;
    }

    .btn:hover {
      background-color: #d62828;
      transform: scale(1.03);
    }

    .hidden {
      display: none;
    }

    .letter {
      text-align: left;
      line-height: 1.6;
      font-size: 1.05rem;
      background: #fff8f9;
      padding: 20px;
      border-radius: 15px;
      border-left: 4px solid #e63946;
    }
  </style>
</head>
<body>

  <!-- Elemento de áudio para tocar as músicas -->
  <audio id="meuAudio" src="musica1.mp3" loop preload="auto"></audio>

  <div class="container">
    
    <!-- SEÇÃO DA GALERIA DE FOTOS -->
    <div id="galeria">
      <h1>Nossos Momentos ❤️</h1>
      
      <div class="photo-card">
        <img id="fotoExibida" src="foto1.jpg" alt="Nossa Foto">
        <p id="legendaExibida" class="caption">Legenda da primeira foto...</p>
      </div>

      <button id="btnAvancar" class="btn" onclick="proximaFoto()">Avançar ❤️</button>
    </div>

    <!-- SEÇÃO DA CARTA FINAL -->
    <div id="carta" class="hidden">
      <h1>Uma Carta Para Você 💌</h1>
      <div class="letter">
        <p>Escreva aqui a sua mensagem especial...</p>
        <br>
        <p>Você é muito importante para mim! ❤️</p>
      </div>
    </div>

  </div>

  <script>
    // Configuração das fotos e legendas
    const momentos = [
      { foto: "foto1.jpg", legenda: "Nosso primeiro momento especial ❤️" },
      { foto: "foto2.jpg", legenda: "Mais um dia inesquecível ao teu lado ✨" },
      { foto: "foto3.jpg", legenda: "Sorrisos que guardo no coração 💖" }
    ];

    let indiceAtual = 0;
    const elementoAudio = document.getElementById('meuAudio');

    function proximaFoto() {
      // Inicia a música no primeiro clique se o navegador tiver bloqueado o som automático
      if (elementoAudio.paused) {
        elementoAudio.play().catch(err => console.log("Erro ao reproduzir áudio:", err));
      }

      indiceAtual++;

      if (indiceAtual < momentos.length) {
        // Atualiza a foto e a legenda
        document.getElementById('fotoExibida').src = momentos[indiceAtual].foto;
        document.getElementById('legendaExibida').innerText = momentos[indiceAtual].legenda;
      } else {
        // Chegou ao fim da galeria: transição para a carta e troca de música
        document.getElementById('galeria').classList.add('hidden');
        document.getElementById('carta').classList.remove('hidden');

        // Troca para a segunda música (Ruth B - Dandelions)
        elementoAudio.pause();
        elementoAudio.src = "musica2.mp3";
        elementoAudio.load();
        elementoAudio.play().catch(err => console.log("Erro ao trocar de música:", err));
      }
    }
  </script>

</body>
</html>
